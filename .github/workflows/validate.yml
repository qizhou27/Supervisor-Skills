name: Validate adaptations

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install existing lint dependency
        run: python -m pip install -r requirements-lint.txt
      - name: Sync regression tests
        run: python -m unittest discover -s tests -v
      - name: Existing upstream skill validation
        run: python -X utf8 scripts/lint_skills.py
      - name: Existing shared-reference validation
        run: python -X utf8 scripts/check_shared_sync.py
      - name: Verify generated Claude package
        run: python scripts/build_plugins.py --check
      - name: Verify invocation policies and both marketplaces
        run: python scripts/verify_adaptation.py
