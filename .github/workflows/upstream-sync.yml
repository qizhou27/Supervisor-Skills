name: Check upstream

on:
  schedule:
    - cron: '23 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch upstream baseline and latest commit
        shell: bash
        run: |
          set -euo pipefail
          url=$(python -I -c 'import json; print(json.load(open(".upstream/state.json"))["repository"])')
          base=$(python -I -c 'import json; print(json.load(open(".upstream/state.json"))["commit"])')
          ref=$(python -I -c 'import json; print(json.load(open(".upstream/state.json"))["branch"])')
          git remote add plugin-upstream "$url"
          git fetch --no-tags --depth=1 plugin-upstream "$base" "$ref"
          echo "UPSTREAM_SHA=$(git rev-parse "refs/remotes/plugin-upstream/$ref")" >> "$GITHUB_ENV"
      - name: Preview update without publishing or executing upstream code
        shell: bash
        run: |
          set +e
          python -I scripts/sync_upstream.py "$UPSTREAM_SHA" --dry-run > "$RUNNER_TEMP/upstream-check.json"
          result=$?
          set -e
          echo "Upstream commit: $UPSTREAM_SHA" >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/upstream-check.json" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$result" != 0 && "$result" != 2 ]]; then
            exit "$result"
          fi
